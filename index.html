                          className={`
                            relative overflow-hidden rounded-3xl border-2 ${disease.borderColor} ${disease.color} 
                            shadow-[4px_4px_0px_0px_rgba(0,0,0,0.1)] hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,0.1)] hover:-translate-y-1
                            transition-all duration-200 active:scale-95 cursor-pointer
                          `}
                        >
                          {/* Decorative corner icon */}
                          {disease.decoration}

                          <div className="p-5 flex items-center space-x-4 relative z-10">
                            <div className={`p-4 rounded-2xl ${disease.accentColor} shadow-inner shrink-0 transform -rotate-3`}>
                              {disease.icon}
                            </div>
                            <div className="flex-1 min-w-0">
                              <h3 className={`font-bold text-lg ${disease.textColor} tracking-tight`}>{disease.title}</h3>
                              <p className="text-sm text-gray-600 truncate opacity-80">{disease.description}</p>
                            </div>
                            <div className={`w-8 h-8 rounded-full bg-white flex items-center justify-center ${disease.textColor} shadow-sm`}>
                                 <ChevronRight className="w-6 h-6" />
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="animate-slideIn">
                    {/* Detail View Header */}
                    <div className="mb-6">
                      <button 
                        onClick={handleBack}
                        className="mb-4 flex items-center font-bold text-gray-500 hover:text-gray-800 transition-colors bg-white px-4 py-2 rounded-full shadow-[2px_2px_0px_0px_rgba(0,0,0,0.05)] border-2 border-gray-100 active:translate-y-0.5 active:shadow-none"
                      >
                        <ChevronLeft className="w-5 h-5 mr-1" />
                        กลับหน้าหลัก
                      </button>
                      
                      <div className={`
                        flex items-center space-x-4 p-5 rounded-3xl ${selectedDisease.color} border-2 ${selectedDisease.borderColor}
                        shadow-[4px_4px_0px_0px_rgba(0,0,0,0.05)] relative overflow-hidden
                      `}>
                        {selectedDisease.decoration}
                        <div className={`p-3 rounded-2xl ${selectedDisease.accentColor} shadow-sm rotate-3 text-white`}>
                            {selectedDisease.icon}
                        </div>
                        <div>
                          <h2 className={`text-xl font-bold ${selectedDisease.textColor}`}>{selectedDisease.title}</h2>
                          <p className="text-sm text-gray-600 mt-1 opacity-90">{selectedDisease.description}</p>
                        </div>
                      </div>
                    </div>

                    {/* Horizontal Scrollable Images with Buttons */}
                    <div className="relative group">
                        <div className="flex items-center justify-between mb-3 px-2">
                            <div className="inline-flex items-center bg-white px-3 py-1 rounded-xl border border-gray-100 shadow-sm">
                                 <Info className="w-4 h-4 mr-2 text-yellow-500" /> 
                                 <span className="text-sm font-bold text-gray-600">ตัวอย่างภาพ</span>
                            </div>
                            <span className="text-xs text-gray-400 font-medium bg-white/50 px-2 py-1 rounded-lg">คลิกเพื่อขยาย 🔍</span>
                        </div>
                        
                        <div className="relative">
                            {/* Left Button */}
                            <button 
                                onClick={() => scroll('left')}
                                className="absolute -left-2 top-1/2 -translate-y-1/2 z-20 p-3 bg-white rounded-full shadow-[0px_4px_10px_rgba(0,0,0,0.1)] text-yellow-500 hover:text-yellow-600 hover:scale-110 transition-all border-4 border-yellow-50 active:scale-95"
                            >
                                <ChevronLeft className="w-6 h-6 stroke-[3]" />
                            </button>

                            {/* Right Button */}
                            <button 
                                onClick={() => scroll('right')}
                                className="absolute -right-2 top-1/2 -translate-y-1/2 z-20 p-3 bg-white rounded-full shadow-[0px_4px_10px_rgba(0,0,0,0.1)] text-yellow-500 hover:text-yellow-600 hover:scale-110 transition-all border-4 border-yellow-50 active:scale-95"
                            >
                                <ChevronRight className="w-6 h-6 stroke-[3]" />
                            </button>

                            <div 
                                ref={scrollContainerRef}
                                className="flex overflow-x-auto snap-x snap-mandatory pb-8 gap-4 px-2 scrollbar-hide scroll-smooth pt-2"
                            >
                                {selectedDisease.images.map((imgUrl, index) => (
                                    <div 
                                        key={index} 
                                        className="snap-center shrink-0 w-[65vw] md:w-[220px] flex-none cursor-pointer group/item perspective-1000"
                                        onClick={() => setFullScreenImage(imgUrl)}
                                    >
                                        <div className="
                                            relative bg-white p-3 rounded-3xl border-2 border-gray-100 h-full 
                                            shadow-[0_4px_6px_-1px_rgba(0,0,0,0.1),0_2px_4px_-1px_rgba(0,0,0,0.06)] 
                                            transition-all duration-300 transform group-hover/item:rotate-1 group-hover/item:scale-[1.02]
                                        ">
                                            <div className="relative rounded-2xl overflow-hidden bg-gray-50 aspect-[3/4] border border-gray-100">
                                                <img 
                                                    src={imgUrl} 
                                                    alt={`${selectedDisease.title} - ${index + 1}`}
                                                    className="w-full h-full object-cover"
                                                    loading="lazy"
                                                    onError={(e) => {
                                                        e.target.onerror = null;
                                                        e.target.src = "https://placehold.co/300x400?text=No+Image+Found";
                                                    }}
                                                />
                                                <div className="absolute inset-0 bg-yellow-400/20 opacity-0 group-hover/item:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-[1px]">
                                                    <div className="bg-white p-3 rounded-full shadow-lg transform scale-0 group-hover/item:scale-100 transition-transform duration-200">
                                                        <ZoomIn className="w-6 h-6 text-yellow-500" />
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="mt-3 text-center">
                                                <span className="text-xs font-bold text-gray-400 bg-gray-100 px-3 py-1 rounded-full">
                                                    #{index + 1}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                  </div>
                )}
              </main>

              {/* Full Screen Image Modal (Lightbox) */}
              {fullScreenImage && (
                <div 
                    className="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn"
                    onClick={() => setFullScreenImage(null)}
                >
                    <button 
                        className="absolute top-4 right-4 z-50 p-3 bg-white/10 rounded-full text-white hover:bg-white/20 transition-all active:scale-90"
                        onClick={() => setFullScreenImage(null)}
                    >
                        <X className="w-8 h-8" />
                    </button>
                    <div className="w-full h-full flex items-center justify-center relative">
                        <img 
                            src={fullScreenImage} 
                            alt="Full Screen" 
                            className="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl"
                            onClick={(e) => e.stopPropagation()} 
                        />
                    </div>
                    <div className="absolute bottom-6 left-0 w-full text-center pointer-events-none">
                        <span className="bg-white/20 backdrop-blur-md text-white px-6 py-2 rounded-full text-sm font-medium border border-white/10">
                            แตะพื้นหลังเพื่อปิด
                        </span>
                    </div>
                </div>
              )}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
